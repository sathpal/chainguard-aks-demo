# Any cgr.dev/chainguard/* image must carry a valid Sigstore keyless signature
# from Chainguard's release workflow, recorded in the Rekor transparency log.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-chainguard-images
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  rules:
    - name: chainguard-keyless
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [chainguard-demo]
      verifyImages:
        - imageReferences: ["cgr.dev/chainguard/*"]
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor: { url: https://rekor.sigstore.dev }
